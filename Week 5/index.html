<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First CSS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
    :root {
        --color-page-background: #fffbea;
        --color-text: #243247;
        --color-heading: #1d4ed8;
        --color-paragraph: #166534;
        --color-card-background: #ffffff;
        --color-hero-background: #dbeafe;
        --space-small: 8px;
        --space-medium: 16px;
        --space-large: 20px;
    }

    body {
        background-color: var(--color-page-background);
        color: var(--color-text);
        font-family: "Lato", sans-serif;
        font-size: 16px;
        line-height: 1.6;
    }

    * {
        box-sizing: border-box;
    }

    h1 {
        color: var(--color-heading);
        font-size: 2.25rem;
        line-height: 1.2;
        text-align: center;
    }

    p {
        color: var(--color-paragraph);
        font-size: 1.125rem;
        line-height: 1.7;
    }

    .card {
        max-width: 500px;
        margin: var(--space-large) auto;
        padding: var(--space-medium);
        background-color: var(--color-card-background);
        border-radius: var(--space-small);
    }

    #hero {
        padding: var(--space-medium);
        background-color: var(--color-hero-background);
    }
</style>
</head>
<body>
    <h1 id="hero">Welcome to My Website</h1>
    <p class="card">This is my first CSS program.</p>


</body>
</html>
