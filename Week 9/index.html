<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Grid</title>
  <style>
    body {
      font-size: 1rem;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-areas:
        "head"
        "side"
        "main"
        "foot";
      gap: 16px;
    }

    .head { grid-area: head; }
    .side { grid-area: side; }
    .main { grid-area: main; }
    .foot { grid-area: foot; }

    .grid-item {
      padding: 20px;
      background: lightblue;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px;
    }

    .nav-links {
      display: flex;
      gap: 16px;
    }

    .nav-links a {
      text-decoration: none;
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: 1fr 2fr;
        grid-template-areas:
          "head head"
          "side main"
          "foot foot";
      }
    }

    @media (min-width: 1024px) {
      .grid {
        grid-template-columns: 1fr 3fr;
        gap: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="grid">
    <header class="grid-item head">
      <nav class="navbar" aria-label="Main navigation">
        <strong>My Site</strong>
        <div class="nav-links">
          <a href="#">Home</a>
          <a href="#main">Main</a>
          <a href="#footer">Foot</a>
        </div>
      </nav>
    </header>
    <aside class="grid-item side"><span>??</span><span>Side</span></aside>
    <main class="grid-item main" id="main"><span>Main content</span></main>
    <footer class="grid-item foot" id="footer"><span>Foot</span></footer>
  </div
</body>
</html>
