<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Grid</title>
  <style>
    body {
      font-size: 1rem;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-areas:
        "head"
        "side"
        "main"
        "foot";
      gap: 16px;
    }

    .head { grid-area: head; }
    .side { grid-area: side; }
    .main { grid-area: main; }
    .foot { grid-area: foot; }

    .grid-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px;
      background: lightblue;
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: 1fr 2fr;
        grid-template-areas:
          "head head"
          "side main"
          "foot foot";
      }
    }

    @media (min-width: 1024px) {
      .grid {
        grid-template-columns: 1fr 3fr;
        gap: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="grid">
    <header class="grid-item head"><span>??</span><span>Head</span></header>
    <aside class="grid-item side"><span>??</span><span>Side</span></aside>
    <main class="grid-item main"><span>??</span><span>Main</span></main>
    <footer class="grid-item foot"><span>??</span><span>Foot</span></footer>
  </div>
</body>
</html>
