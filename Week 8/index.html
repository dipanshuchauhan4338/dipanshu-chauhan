<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid</title>
  <style>
    .grid {
      display: grid;
      grid-template-columns: 200px 1fr;
      grid-template-areas:
        "head head"
        "side main"
        "foot foot";
      gap: 20px;
    }

    .head { grid-area: head; }
    .side { grid-area: side; }
    .main { grid-area: main; }
    .foot { grid-area: foot; }

    .grid-item {
      padding: 20px;
      text-align: center;
      background: lightblue;
    }
  </style>
</head>
<body>
  <div class="grid">
    <header class="grid-item head">Head</header>
    <aside class="grid-item side">Side</aside>
    <main class="grid-item main">Main</main>
    <footer class="grid-item foot">Foot</footer>
  </div>
</body>
</html>
